[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codepulse"
version = "0.1.0"
description = "Local-first code change intelligence and visualization platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "CodePulse Contributors" }
]
dependencies = [
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "watchdog>=4.0.0",
    "gitpython>=3.1.40",
    "networkx>=3.2",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
codepulse = "codepulse.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["codepulse*"]
